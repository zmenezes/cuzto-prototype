<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Cuzto Admin</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      :root {
        --primary: #6366f1;
        --primary-deep: #4f46e5;
        --primary-hover: #4338ca;
        --primary-light: #eef2ff;
        --primary-subtle: #f5f3ff;
        --primary-shadow: #4338ca;
        --primary-soft-shadow: #c7d2fe;
        --primary-glow: rgba(99, 102, 241, 0.25);
      }
      .login-page {
        background: linear-gradient(135deg, #f5f3ff 0%, #eef2ff 100%);
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-theme">
        <button
          class="btn btn-sm btn-outline"
          onclick="
            var t = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </div>
      <div class="login-card">
        <div class="login-logo">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          />
          <img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div style="text-align: center; margin-bottom: 6px">
          <span
            style="
              font-size: 11px;
              font-weight: 800;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              padding: 3px 10px;
              border-radius: var(--r-pill);
              background: var(--primary-light);
              color: var(--primary-deep);
            "
            >Admin</span
          >
        </div>
        <div class="login-heading">Painel Administrativo</div>
        <form onsubmit="return false;">
          <div class="field">
            <label>E-mail</label>
            <div class="input">
              <input type="email" placeholder="admin@cuzto.com.br" value="admin@cuzto.com.br" />
            </div>
          </div>
          <div class="field">
            <label>Senha</label>
            <div class="pw-wrap">
              <div class="input">
                <input type="password" placeholder="Sua senha" value="admin123" />
              </div>
              <button type="button" class="pw-toggle">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <div style="text-align: right; margin-bottom: 18px">
            <a
              href="#"
              style="
                font-size: 13px;
                font-weight: 700;
                color: var(--primary-deep);
                text-decoration: none;
              "
              >Esqueci minha senha</a
            >
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block btn-lg"
            onclick="window.location = 'dashboard.html'"
          >
            Entrar
          </button>
        </form>
        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-3)">
          Acesso restrito a administradores Cuzto.
        </div>
      </div>
    </div>
    <script src="../shared/app.js"></script>
  </body>
</html>
