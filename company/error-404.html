<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .error-code {
        font-family: var(--f-display);
        font-size: 80px;
        font-weight: 800;
        color: var(--ink-3);
        letter-spacing: -0.04em;
        opacity: 0.3;
        line-height: 1;
      }
      .error-title {
        font-family: var(--f-display);
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
        margin-top: 12px;
      }
      .error-desc {
        font-size: 15px;
        color: var(--ink-3);
        margin-top: 8px;
        max-width: 36ch;
      }
      .error-actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div>
        <div class="login-logo" style="margin-bottom: 32px">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          /><img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="error-code">404</div>
        <div class="error-title">Página não encontrada</div>
        <div class="error-desc">O endereço que você procura não existe ou foi movido.</div>
        <div class="error-actions">
          <a href="dashboard.html" class="btn btn-sm btn-primary">Voltar ao dashboard</a>
        </div>
      </div>
    </div>
    <script src="../shared/app.js"></script>
  </body>
</html>
