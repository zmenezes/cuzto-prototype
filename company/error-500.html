<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro interno — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .error-icon {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--error-soft);
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
      }
      .error-icon svg {
        width: 32px;
        height: 32px;
        stroke: var(--error);
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .error-title {
        font-family: var(--f-display);
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
      }
      .error-desc {
        font-size: 15px;
        color: var(--ink-3);
        margin-top: 8px;
        max-width: 36ch;
      }
      .error-code-box {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: var(--surface-2);
        border: 2px solid var(--border);
        border-radius: var(--r-md);
        font-family: var(--f-mono);
        font-size: 13px;
        color: var(--ink-3);
        margin-top: 16px;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--border);
      }
      .error-code-box:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .error-code-box svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .error-actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div>
        <div class="login-logo" style="margin-bottom: 32px">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          /><img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="error-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </div>
        <div class="error-title">Erro interno do servidor</div>
        <div class="error-desc">Algo deu errado. Nossa equipe foi notificada.</div>
        <div
          class="error-code-box"
          onclick="navigator.clipboard && navigator.clipboard.writeText('ERR_INTERNAL_500')"
        >
          <code>ERR_INTERNAL_500</code
          ><svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </div>
        <div class="error-actions">
          <button class="btn btn-sm btn-primary" onclick="location.reload()">
            Tentar novamente
          </button>
          <a href="dashboard.html" class="btn btn-sm btn-ghost">Voltar ao dashboard</a>
        </div>
      </div>
    </div>
    <script src="../shared/app.js"></script>
  </body>
</html>
