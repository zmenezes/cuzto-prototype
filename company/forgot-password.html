<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-theme">
        <button
          class="btn btn-sm btn-outline"
          onclick="
            var t = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </div>

      <div class="login-card">
        <div class="login-logo">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          />
          <img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="login-heading">Recuperar senha</div>
        <p
          style="
            text-align: center;
            color: var(--ink-3);
            font-size: 14px;
            margin-bottom: 24px;
            max-width: 32ch;
            margin-left: auto;
            margin-right: auto;
          "
        >
          Informe seu e-mail e enviaremos um link para redefinir sua senha.
        </p>

        <div class="field">
          <label>E-mail</label>
          <div class="input">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22 6 12 13 2 6" />
            </svg>
            <input type="email" placeholder="seu@empresa.com" />
          </div>
        </div>

        <button
          class="btn btn-primary btn-block btn-lg"
          onclick="document.getElementById('fp-ok').style.display = 'flex'"
        >
          Enviar link
        </button>

        <div
          class="login-err"
          id="fp-ok"
          style="
            display: none;
            background: var(--success-soft);
            color: var(--success-text);
            border-color: var(--success);
          "
        >
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          Link enviado! Verifique sua caixa de entrada.
        </div>

        <a
          href="login.html"
          style="
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-deep);
            text-decoration: none;
          "
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="vertical-align: middle; margin-right: 4px"
          >
            <polyline points="15 18 9 12 15 6" /></svg
          >Voltar ao login
        </a>
      </div>
    </div>

    <script src="../shared/app.js"></script>
  </body>
</html>
