<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-theme">
        <button
          class="btn btn-sm btn-outline"
          onclick="
            var t = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </div>

      <div class="login-card">
        <div class="login-logo">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          />
          <img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="login-heading">Acesse sua conta</div>

        <form onsubmit="return false;">
          <div class="field">
            <label for="email">E-mail</label>
            <div class="input">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22 6 12 13 2 6" />
              </svg>
              <input
                id="email"
                type="email"
                placeholder="seu@empresa.com"
                value="maria@construtora.com.br"
              />
            </div>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <div class="pw-wrap">
              <div class="input">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input id="senha" type="password" placeholder="Sua senha" value="senhasegura123" />
              </div>
              <button type="button" class="pw-toggle">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div style="text-align: right; margin-bottom: 18px">
            <a
              href="forgot-password.html"
              style="
                font-size: 13px;
                font-weight: 700;
                color: var(--primary-deep);
                text-decoration: none;
              "
              >Esqueci minha senha</a
            >
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-block btn-lg"
            onclick="document.getElementById('login-err').style.display = 'flex'"
          >
            Entrar
          </button>

          <div class="login-err" id="login-err" style="display: none">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M15 9l-6 6M9 9l6 6" />
            </svg>
            E-mail ou senha incorretos
          </div>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-3)">
          Primeira vez? Fale com o administrador.
        </div>
      </div>
    </div>

    <script src="../shared/app.js"></script>
  </body>
</html>
