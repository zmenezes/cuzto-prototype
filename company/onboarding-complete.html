<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tudo pronto! — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      .complete-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, var(--bg) 0%, var(--surface-2) 100%);
      }
      .complete-card {
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: var(--r-xl);
        padding: 48px 36px;
        max-width: 500px;
        width: 100%;
        box-shadow:
          0 6px 0 var(--border),
          var(--sh-2);
        text-align: center;
      }
      .check-ring {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--primary);
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        box-shadow: 0 4px 0 var(--primary-shadow);
        position: relative;
      }
      .check-ring::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px solid var(--primary);
        opacity: 0.4;
        animation: pulse-ring 2s ease-out infinite;
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.85);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.2);
          opacity: 0;
        }
      }
      .complete-card h2 {
        font-family: var(--f-display);
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .complete-card .sub {
        color: var(--ink-3);
        font-size: 15px;
        margin-bottom: 28px;
      }
      .checklist {
        text-align: left;
        display: grid;
        gap: 8px;
        margin-bottom: 28px;
      }
      .checklist-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 2px solid var(--border);
        border-radius: var(--r-lg);
        background: var(--surface);
        box-shadow: 0 2px 0 var(--border);
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        transition: border-color var(--t-fast);
      }
      .checklist-item:hover {
        border-color: var(--primary);
        text-decoration: none;
      }
      .checklist-item .cl-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--surface-3);
        display: grid;
        place-items: center;
        flex: none;
      }
      .checklist-item .cl-icon svg {
        width: 14px;
        height: 14px;
        stroke: var(--ink-3);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .checklist-item .cl-arrow {
        margin-left: auto;
        color: var(--ink-3);
      }
      .checklist-item .cl-arrow svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .checklist-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
        text-align: left;
      }
      .complete-actions {
        display: grid;
        gap: 10px;
      }
      @media (max-width: 500px) {
        .complete-card {
          padding: 32px 20px;
          border-radius: var(--r-lg);
        }
      }
    </style>
  </head>
  <body>
    <div class="complete-page">
      <div class="complete-card">
        <div style="margin-bottom: 20px">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          /><img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="check-ring">
          <svg
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </div>
        <h2>Conta criada!</h2>
        <div class="sub">Construtora Horizonte está pronta para usar o Cuzto.</div>

        <div class="checklist-label">Próximos passos (opcional)</div>
        <div class="checklist">
          <a href="policy.html" class="checklist-item">
            <div class="cl-icon">
              <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </div>
            Configurar política de despesas
            <div class="cl-arrow">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
            </div>
          </a>
          <a href="employees.html" class="checklist-item">
            <div class="cl-icon">
              <svg viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </div>
            Cadastrar funcionários
            <div class="cl-arrow">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
            </div>
          </a>
          <a href="settings-whatsapp.html" class="checklist-item">
            <div class="cl-icon">
              <svg viewBox="0 0 24 24">
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                />
              </svg>
            </div>
            Conectar WhatsApp
            <div class="cl-arrow">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
            </div>
          </a>
        </div>

        <div class="complete-actions">
          <a href="dashboard.html" class="btn btn-primary btn-lg btn-block">Ir para o Dashboard</a>
        </div>
      </div>
    </div>
    <script src="../shared/app.js"></script>
  </body>
</html>
