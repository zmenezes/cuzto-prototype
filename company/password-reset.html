<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha — Cuzto</title>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css" />
    <style>
      .pw-strength {
        height: 6px;
        border-radius: var(--r-pill);
        background: var(--surface-3);
        margin-top: 8px;
        overflow: hidden;
      }
      .pw-strength-fill {
        height: 100%;
        border-radius: var(--r-pill);
        transition:
          width var(--t-slow),
          background var(--t-slow);
      }
      .pw-strength-label {
        font-size: 12px;
        font-weight: 700;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-theme">
        <button
          class="btn btn-sm btn-outline"
          onclick="
            var t = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </div>

      <div class="login-card">
        <div class="login-logo">
          <img
            src="../shared/assets/logo-light.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img"
          />
          <img
            src="../shared/assets/logo-dark.svg"
            alt="Cuzto"
            height="32"
            class="sidebar-logo-img sidebar-logo-dark"
          />
        </div>
        <div class="login-heading">Redefinir senha</div>
        <p
          style="
            text-align: center;
            color: var(--ink-3);
            font-size: 14px;
            margin-bottom: 24px;
            max-width: 32ch;
            margin-left: auto;
            margin-right: auto;
          "
        >
          Crie uma nova senha para sua conta.
        </p>

        <div class="field">
          <label>Nova senha</label>
          <div class="pw-wrap">
            <div class="input">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" placeholder="Mínimo 8 caracteres" id="pw1" />
            </div>
            <button type="button" class="pw-toggle">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="pw-strength">
            <div class="pw-strength-fill" style="width: 75%; background: var(--accent)"></div>
          </div>
          <div class="pw-strength-label" style="color: var(--accent-text)">Boa</div>
        </div>

        <div class="field">
          <label>Confirmar senha</label>
          <div class="pw-wrap">
            <div class="input">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" placeholder="Repita a nova senha" />
            </div>
            <button type="button" class="pw-toggle">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button
          class="btn btn-primary btn-block btn-lg"
          onclick="document.getElementById('pw-ok').style.display = 'flex'"
        >
          Redefinir senha
        </button>

        <div
          class="login-err"
          id="pw-ok"
          style="
            display: none;
            background: var(--success-soft);
            color: var(--success-text);
            border-color: var(--success);
          "
        >
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          Senha alterada com sucesso! Redirecionando ao login...
        </div>

        <a
          href="login.html"
          style="
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-deep);
            text-decoration: none;
          "
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="vertical-align: middle; margin-right: 4px"
          >
            <polyline points="15 18 9 12 15 6" /></svg
          >Voltar ao login
        </a>
      </div>
    </div>

    <script src="../shared/app.js"></script>
  </body>
</html>
